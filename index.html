<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Icons & Favicons -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192x192.png" />
    <link rel="shortcut icon" href="./favicon.svg" />

    <!-- Apple iOS / iPadOS PWA Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spoor" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="./icons/apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="./icons/apple-touch-icon-167x167.png" />

    <!-- Android & Standard Web App Manifest -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Spoor" />

    <!-- Theme Colors -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5efe6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#102119" />
    <meta name="theme-color" content="#102119" />

    <!-- Viewport with viewport-fit=cover for iPhone notch and Dynamic Island -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Meta Details & SEO -->
    <title>SPOOR — Follow the Clues. Find the Animal.</title>
    <meta name="description" content="A mystery animal tracking detective game. Follow footprint spoor, habitats, sizes, and diets to identify creatures across the globe. 100% playable offline." />

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-journal-50 text-stone-900 dark:bg-[#0c1613] dark:text-stone-100 transition-colors duration-200 antialiased selection:bg-amber-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
